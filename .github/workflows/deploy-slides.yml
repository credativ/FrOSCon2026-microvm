name: Build and Publish Slides

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build HTML & PDF Presentations with Marp
        run: |
          cd presentation
          npx -y @marp-team/marp-cli@latest --no-stdin slides.md -o froscon-microvm.html --html --config-file .marprc.yml
          npx -y @marp-team/marp-cli@latest --no-stdin --pdf slides.md -o froscon-microvm.pdf --allow-local-files --html --config-file .marprc.yml

      - name: Prepare GitHub Pages deployment directory
        run: |
          mkdir -p public
          cp presentation/froscon-microvm.html public/index.html
          cp presentation/froscon-microvm.html public/froscon-microvm.html
          cp presentation/froscon-microvm.pdf public/froscon-microvm.pdf
          cp -rf presentation/assets public/assets
          cp -rf presentation/charts public/charts

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Upload PDF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: froscon-microvm-pdf
          path: presentation/froscon-microvm.pdf

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
